[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "owncall"
version = "0.1.0"
description = "MCP-powered Slack bot for Grafana/Prometheus alert investigation"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["slack", "grafana", "mcp", "sre", "observability"]
dependencies = [
    "openai-agents>=0.17.6",
    "slack-bolt>=1.18.0",
    "slack-sdk>=3.27.0",
    "pyyaml>=6.0",
    "aiohttp>=3.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.20",
]

[project.scripts]
owncall = "owncall.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/owncall"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
